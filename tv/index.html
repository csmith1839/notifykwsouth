function shade(hex, f){ // f<1 darken, f>1 lighten toward white
  const n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const t = c => f<=1 ? Math.round(c*f) : Math.round(c+(255-c)*(f-1));
  return `rgb(${t(r)},${t(g)},${t(b)})`;
}

/* ---------- math & text helpers ---------- */
const clamp01 = x => x<0?0:x>1?1:x;
const eoCubic = x => 1-Math.pow(1-x,3);
const eoExpo  = x => x>=1?1:1-Math.pow(2,-10*x);
const eoBack  = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const eio     = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function rr(ctx,x,y,w,h,r){
  r = Math.min(r, h/2, w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function setLS(ctx,px){ try{ ctx.letterSpacing = (px||0)+'px'; }catch(e){} }

function wrapText(ctx, text, maxW){
  const out = [];
  String(text||'').split('\n').forEach(par=>{
    const words = par.split(/\s+/).filter(Boolean);
    if(!words.length){ return; }
    let line = '';
    words.forEach(w=>{
      const test = line ? line+' '+w : w;
      if(ctx.measureText(test).width <= maxW || !line){ line = test; }
      else { out.push(line); line = w; }
    });
    if(line) out.push(line);
  });
  return out.length?out:[''];
}
function fontStr(o, size){
  if(o.disp && state.font==='archivo' && archivoReady)
    return `400 ${size}px "Archivo Black",${DISPLAY}`;
  return `${o.italic?'italic ':''}${o.weight||900} ${size}px ${o.family||DISPLAY}`;
}
/* rich text: *word* renders in accent color */
function parseRich(text){
  return String(text||'').split('\n').map(par=>
    par.split(/\s+/).filter(Boolean).map(w=>({t:w.replace(/\*/g,''), hi:w.indexOf('*')>-1}))
  ).filter(p=>p.length);
}
function wrapRich(ctx, paras, maxW){
  const lines=[];
  paras.forEach(tokens=>{
    let line=[];
    tokens.forEach(tok=>{
      const test=line.concat([tok]).map(x=>x.t).join(' ');
      if(ctx.measureText(test).width<=maxW || !line.length) line.push(tok);
      else { lines.push(line); line=[tok]; }
    });
    if(line.length) lines.push(line);
  });
  return lines.length?lines:[[{t:'',hi:false}]];
}
function fitBlock(ctx, text, o){
  let size = Math.round(o.max);
  const min = o.min||18, lh = o.lh||1.06;
  const paras = o.rich ? parseRich(text) : null;
  let lines, richLines=null;
  for(let i=0;i<40;i++){
    ctx.font = fontStr(o,size); setLS(ctx, (o.ls||0)*size);
    if(paras){ richLines = wrapRich(ctx, paras, o.maxW); lines = richLines.map(l=>l.map(t=>t.t).join(' ')); }
    else lines = wrapText(ctx, text, o.maxW);
    const h = lines.length*size*lh;
    const wide = lines.some(l=>ctx.measureText(l).width > o.maxW+1);
    if((h<=o.maxH && !wide) || size<=min) break;
    size = Math.max(min, Math.floor(size*0.93));
  }
  ctx.font = fontStr(o,size); setLS(ctx,(o.ls||0)*size);
  if(paras){ richLines = wrapRich(ctx, paras, o.maxW); lines = richLines.map(l=>l.map(t=>t.t).join(' ')); }
  else lines = wrapText(ctx, text, o.maxW);
  let w = 0; lines.forEach(l=>{ w = Math.max(w, ctx.measureText(l).width); });
  setLS(ctx,0);
  return {size, lines, richLines, lh, h:lines.length*size*lh, w, o};
}
function drawLines(ctx, fb, x, yTop, color, align, accent, tFrac){
  ctx.font = fontStr(fb.o, fb.size); setLS(ctx,(fb.o.ls||0)*fb.size);
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const partial = tFrac!=null && tFrac<1 && (state.anim==='type'||state.anim==='cascade');
  const mode = partial ? state.anim : null;
  const linesTok = (fb.richLines && accent) ? fb.richLines : fb.lines.map(l=>[{t:l, hi:false}]);
  const sp = ctx.measureText(' ').width;
  let budget = Infinity;
  if(mode==='type'){
    const total = linesTok.reduce((a,l)=>a+l.reduce((b,t)=>b+t.t.length+1,0),0);
    budget = Math.floor(total * clamp01(tFrac));
  }
  let caret = null;
  for(let i=0;i<linesTok.length;i++){
    const toks = linesTok[i];
    let lineAlpha = 1, lineDy = 0;
    if(mode==='cascade'){
      const lp = clamp01((clamp01(tFrac)*(linesTok.length+0.6) - i)/1.0);
      if(lp<=0) break;
      lineAlpha = eoCubic(lp); lineDy = (1-eoCubic(lp))*fb.size*0.5;
    }
    const lw = ctx.measureText(toks.map(t=>t.t).join(' ')).width;
    let cx = align==='center' ? x-lw/2 : x;
    const y = yTop + i*fb.size*fb.lh + fb.size*0.82;
    ctx.save(); ctx.globalAlpha *= lineAlpha; ctx.translate(0,lineDy);
    let stop = false;
    for(const tok of toks){
      if(budget<=0){ stop = true; break; }
      let txt = tok.t;
      if(mode==='type' && txt.length>budget){ txt = txt.slice(0,budget); }
      budget -= tok.t.length+1;
      ctx.fillStyle = tok.hi ? accent : color;
      ctx.fillText(txt, cx, y);
      cx += ctx.measureText(txt).width + (txt===tok.t ? sp : 0);
      if(mode==='type' && txt!==tok.t){ stop = true; }
      if(stop){ break; }
    }
    if(mode==='type' && (stop || budget<=0)){ caret = {x:cx, y}; ctx.restore(); break; }
    ctx.restore();
  }
  if(caret){
    ctx.fillStyle = accent||color;
    ctx.fillRect(caret.x+2, caret.y-fb.size*0.74, Math.max(3,fb.size*0.08), fb.size*0.88);
  }
  ctx.textAlign='left'; setLS(ctx,0);
}

/* beat timing */
function beatTimes(){
  let d = Math.min(0.28, 0.85/state.dur);   // reveal length (normalized)
  let stag = Math.min(0.12, 0.38/state.dur); // stagger between blocks
  if(state.anim==='type'){ d = Math.min(0.42, 2.2/state.dur); stag = Math.min(0.3, 1.8/state.dur); }
  return {d, stag, start:0.045};
}
function beatP(tn, i){
  if(state.anim==='pulse') return 1;
  const {d,stag,start} = beatTimes();
  return clamp01((tn - (start + i*stag))/d);
}
/* reveal wrapper: applies per-anim entrance around a draw callback */
function reveal(ctx, p, box, fn, colors){
  if(p<=0) return;
  ctx.save();
  const a = state.anim;
  if(a==='slide'){ ctx.globalAlpha = Math.min(1, p*1.6); const e=eoBack(p); ctx.translate(0,(1-e)*Math.min(80, box.h*0.7)); }
  else if(a==='fade'){ const e=eoCubic(p); ctx.globalAlpha = e; ctx.translate(0,(1-e)*16); }
  else if(a==='pop'){
    const e=eoBack(p); ctx.globalAlpha = Math.min(1, p*1.8);
    const px=box.x+box.w/2, py=box.y+box.h/2;
    ctx.translate(px,py); const sc=0.82+0.18*e; ctx.scale(sc,sc); ctx.translate(-px,-py);
  }
  else if(a==='blur'){
    const e=eoCubic(p); ctx.globalAlpha = e;
    try{ ctx.filter = 'blur('+((1-e)*9).toFixed(1)+'px)'; }catch(err){}
    ctx.translate(0,(1-e)*14);
  }
  else if(a==='type' || a==='cascade'){ ctx.globalAlpha = Math.min(1, p*2.2); }
  else if(a==='wipe'){
    const e = eoExpo(p);
    ctx.beginPath(); ctx.rect(box.x-6, box.y-10, (box.w+14)*e+6, box.h+20); ctx.clip();
    fn(); // draw content clipped
    if(e<0.995){ ctx.fillStyle = colors.accent; ctx.fillRect(box.x-6+(box.w+14)*e, box.y-6, Math.max(5,box.h*0.06), box.h+12); }
    ctx.restore(); return;
  }
  fn();
  ctx.restore();
}

/* ---------- deterministic-ish decorative randoms (fixed per load) ---------- */
const RAND = Array.from({length:64}, (_,i)=> (Math.sin(i*127.1+3.7)*43758.5453)%1 ).map(v=>Math.abs(v));
const CONFETTI = Array.from({length:18}, (_,i)=>({
  a: RAND[i]*Math.PI*2, sp: 0.35+RAND[i+9]*0.85, rot: RAND[i+20]*6.28, sz: 0.5+RAND[i+30]*0.9, k: i%3
}));

/* ---------- grain ---------- */
let grainPat = null;
function makeGrain(ctx){
  if(grainPat) return grainPat;
  const g = document.createElement('canvas'); g.width=g.height=140;
  const gc = g.getContext('2d'); const id = gc.createImageData(140,140);
  for(let i=0;i<id.data.length;i+=4){ const v = 128+Math.floor((RAND[(i/4)%64]*2-1)*110); id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=26; }
  gc.putImageData(id,0,0);
  grainPat = ctx.createPattern(g,'repeat');
  return grainPat;
}

function drawPhoto(ctx,W,H,tn,colors){

  let z = 1.06;
  if(state.anim==='fade') z = 1.05 + 0.07*eoCubic(tn);
  else if(state.anim==='pulse') z = 1.07 + 0.03*Math.sin(2*Math.PI*tn);
  else z = 1.05 + 0.02*Math.sin(2*Math.PI*tn);
  const s = Math.max(W/img.width, H/img.height)*z;
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
  const gr = ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'rgba(8,8,11,0.38)'); gr.addColorStop(0.55,'rgba(8,8,11,0.45)'); gr.addColorStop(1,'rgba(8,8,11,0.82)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
  if(state.theme==='redfield'){ ctx.fillStyle='rgba(206,1,31,0.30)'; ctx.fillRect(0,0,W,H); }
}
function drawMotif(ctx,W,H,tn,c){
  if(!state.toggles.motif || c.photo) return;
  const dx = Math.sin(2*Math.PI*tn)*W*0.006, dy = Math.cos(2*Math.PI*tn)*H*0.005;
  ctx.save();
  if(c.theme==='signal'){
    ctx.fillStyle = c.soft;
    ctx.save(); ctx.translate(W*0.86+dx, H*0.06+dy); ctx.rotate(-0.32);
    rr(ctx,-W*0.05,-H*0.3,W*0.11,H*0.62,W*0.055); ctx.fill();
    rr(ctx,W*0.09,-H*0.36,W*0.11,H*0.62,W*0.055); ctx.fill(); ctx.restore();
    ctx.strokeStyle = c.line; ctx.lineWidth = Math.max(2,H*0.002);
    ctx.beginPath(); ctx.arc(W*0.1-dx, H*0.9, H*0.16, 0, 7); ctx.stroke();
    ctx.fillStyle = c.accent;
    for(let i=0;i<3;i++){ const s=H*0.012; ctx.fillRect(W*0.055+i*s*2.2+dx*0.5, H*0.078-i*s*0.4, s, s); }
  } else if(c.theme==='obsidian'){
    const g = ctx.createRadialGradient(W*0.18+dx,H*0.12,0,W*0.18,H*0.12,H*0.75);
    g.addColorStop(0,'rgba(206,1,31,0.16)'); g.addColorStop(1,'rgba(206,1,31,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(232,17,45,0.35)'; ctx.lineWidth=Math.max(2,H*0.0024);
    ctx.beginPath(); ctx.arc(W*0.9-dx, H*0.42+dy, H*0.2, 0, 7); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(W*(0.62+i*0.09)+dx, H); ctx.lineTo(W*(0.82+i*0.09)+dx, 0); ctx.stroke(); }
  } else if(c.theme==='redfield'){
    ctx.fillStyle='rgba(0,0,0,0.10)';
    ctx.beginPath(); ctx.arc(W*0.94+dx, H*0.08+dy, H*0.42, 0, 7); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.07)';
    ctx.beginPath(); ctx.arc(W*0.04-dx, H*0.96, H*0.34, 0, 7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=Math.max(2,H*0.002);
    ctx.beginPath(); ctx.arc(W*0.5, H*1.28, H*0.62, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  } else if(c.theme==='graphite'){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(W*0.9+dx, H*0.12+dy, H*0.3, 0, 7); ctx.fill();
    ctx.fillStyle='rgba(20,20,25,0.05)';
    ctx.beginPath(); ctx.arc(W*0.08-dx, H*0.92, H*0.3, 0, 7); ctx.fill();
    ctx.fillStyle=c.accent;
    for(let i=0;i<4;i++){ const s=H*0.011; ctx.fillRect(W*0.9+i*s*2- dx*0.5, H*0.9-i*s*0.5, s, s); }
  } else if(c.theme==='blackout'){
    ctx.strokeStyle='rgba(232,17,45,0.5)'; ctx.lineWidth=Math.max(2,H*0.0022);
    const mm = Math.round(0.07*Math.min(W,H));
    ctx.beginPath(); ctx.moveTo(mm, mm*0.7); ctx.lineTo(mm+W*0.12+dx*2, mm*0.7); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=Math.max(2,H*0.02);
    ctx.beginPath(); ctx.arc(W*1.02+dx, H*0.5+dy, H*0.44, 0, 7); ctx.stroke();
    ctx.fillStyle='rgba(232,17,45,0.9)';
    const s=H*0.01; ctx.fillRect(W-mm-s, mm*0.7-s/2, s, s);
  } else if(c.theme==='spine'){
    const bw = Math.round(0.07*Math.min(W,H))*0.52;
    ctx.fillStyle=c.red; ctx.fillRect(0,0,bw,H);
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(bw-Math.max(2,bw*0.06),0,Math.max(2,bw*0.06),H);
    ctx.fillStyle='#FFFFFF';
    const s=bw*0.3; ctx.fillRect((bw-s)/2, H*0.06+dy*0.5, s, s);
    ctx.fillStyle=c.soft;
    ctx.beginPath(); ctx.arc(W*0.94+dx, H*0.86, H*0.24, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = c.line; ctx.lineWidth=Math.max(2,H*0.0018);
    const m = Math.round(0.07*Math.min(W,H));
    ctx.beginPath(); ctx.moveTo(m, m*0.72); ctx.lineTo(W-m, m*0.72); ctx.stroke();
    ctx.fillStyle=c.accent; const s=H*0.012; ctx.fillRect(W-m-s, m*0.72-s/2, s, s);
    ctx.fillStyle=c.soft; ctx.beginPath(); ctx.arc(W*0.92+dx, H*0.78+dy, H*0.26, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- shared components ---------- */
function chipMetrics(ctx, text, fs, W){
  ctx.font = `800 ${fs}px ${DISPLAY}`; setLS(ctx, fs*0.09);
  const tw = Math.min(ctx.measureText(String(text)).width, W*0.86);
  setLS(ctx,0);
  return {w: tw + fs*1.5, h: fs*2.05, tw, fs};
}
function drawChip(ctx, text, x, y, m, c, style){
  const {w,h,fs} = m;
  if(style==='outline'){
    ctx.strokeStyle = c.photo? 'rgba(255,255,255,.8)' : (c.theme==='redfield'?'rgba(255,255,255,.75)':c.accent);
    ctx.lineWidth = Math.max(2, fs*0.11); rr(ctx,x,y,w,h,h*0.24); ctx.stroke();
    ctx.fillStyle = c.ink;
  } else {
    ctx.fillStyle = c.accent; rr(ctx,x,y,w,h,h*0.24); ctx.fill();
    ctx.fillStyle = c.chipInk;
  }
  ctx.font = `800 ${fs}px ${DISPLAY}`; setLS(ctx, fs*0.09);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(text, x + fs*0.75, y + h*0.5 + fs*0.36);
  setLS(ctx,0);
}
let lastCtaBox = null;
function drawBrand(ctx,W,H,tn,c){
  const m = Math.round(0.07*Math.min(W,H));
  const p = state.anim==='pulse' ? 1 : clamp01((tn-0.02)/Math.min(0.28,0.85/state.dur));
  if(p<=0) return;
  ctx.save(); ctx.globalAlpha = eoCubic(p);
  if(state.toggles.lockup){
    const minD = Math.min(W,H);
    let fs = Math.max(15, Math.min(H*0.0185, minD*0.026));
    const y = H - m*0.78;
    ctx.textBaseline='alphabetic';
    // measure and shrink / trim so left lockup never collides with heykw.com
    let showSub = true;
    const fits = (f)=>{
      ctx.font=`800 ${f}px ${DISPLAY}`; setLS(ctx, f*0.14);
      const w1 = ctx.measureText('KELLER WILLIAMS').width;
      const wr = ctx.measureText('heykw.com').width;
      ctx.font=`500 ${f}px ${DISPLAY}`;
      const w2 = showSub ? ctx.measureText('INDY METRO PARTNERS').width + f*0.55 : 0;
      setLS(ctx,0);
      return f*0.62 + f*0.6 + w1 + w2 + f*1.2 + wr <= W - 2*m;
    };
    while(!fits(fs) && fs>12){ fs = Math.floor(fs*0.93); }
    if(!fits(fs)) showSub = false;
    if(state.assets.logo){
      const lg = state.assets.logo, lh = Math.min(H*0.05, minD*0.07), lw = lh*lg.width/lg.height;
      ctx.drawImage(lg, m, y-lh+fs*0.3, Math.min(lw, W*0.3), lh);
    } else {
      const s = fs*0.62;
      ctx.fillStyle = c.theme==='redfield'? '#FFFFFF' : c.red;
      if(c.photo) ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(m, y-s-fs*0.12, s, s);
      ctx.font=`800 ${fs}px ${DISPLAY}`; setLS(ctx, fs*0.14);
      ctx.fillStyle=c.ink; ctx.fillText('KELLER WILLIAMS', m+s+fs*0.6, y);
      const w1 = ctx.measureText('KELLER WILLIAMS').width;
      if(showSub){
        ctx.font=`500 ${fs}px ${DISPLAY}`; ctx.fillStyle=c.sub;
        ctx.fillText('INDY METRO PARTNERS', m+s+fs*0.6+w1+fs*0.55, y);
      }
      setLS(ctx,0);
    }
    ctx.font = `800 ${fs}px ${DISPLAY}`;
    ctx.fillStyle = c.theme==='redfield' ? '#FFFFFF' : (c.photo? '#FFFFFF' : c.accent);
    ctx.textAlign='right'; ctx.fillText('heykw.com', W-m, y); ctx.textAlign='left';
  }
  if(state.toggles.disc){
    const f3 = Math.max(10, Math.min(H*0.0102, Math.min(W,H)*0.0145));
    ctx.font = `500 ${f3}px ${DISPLAY}`;
    ctx.fillStyle = c.sub; ctx.globalAlpha *= 0.75; ctx.textAlign='center';
    ctx.fillText('Keller Williams Realty, Inc. Each office is independently owned and operated.', W/2, H - m*0.3);
    ctx.textAlign='left';
  }
  ctx.restore();
}

/* ---------- QR geometry (shared by layout + draw) ---------- */
function qrGeom(W,H){
  if(!state.qr.on) return null;
  const minD = Math.min(W,H), m = Math.round(0.07*minD);
  const sz = state.qr.size==='s'? minD*0.125 : state.qr.size==='l'? minD*0.205 : minD*0.16;
  const pad = sz*0.08;
  const cardW = sz+pad*2, cardH = sz+pad*2, labelH = Math.max(13,sz*0.115)*1.6;
  // Story: keep the code above the Reels caption/UI zone (bottom ~30%) and left of the
  // like/comment/share icon rail, so it stays scannable in-feed
  const x = state.format==='story' ? W*0.855-cardW : W-m-cardW;
  const y = state.format==='story' ? H*0.695-cardH-labelH : H-m*1.45-cardH-labelH;
  return {x,y,cardW,cardH,sz,pad,labelH, top:y, bottom:y+cardH+labelH};
}

/* ---------- generic stack renderer (left or centered, QR-aware) ---------- */
function leftStack(ctx,W,H,tn,c,blocks){
  const minD = Math.min(W,H);
  const m = Math.round(0.07*minD);
  const cw = W - m*2;
  const align = (state.type==='spotlight') ? 'center' : state.align;
  const qg = qrGeom(W,H);
  // width available when a block must clear the QR card
  const resW = qg ? Math.max(cw*0.45, align==='left' ? qg.x - m*1.35 : 2*(qg.x - m*0.55 - W/2)) : cw;
  const isStory = state.format==='story';

  function buildAll(narrowSet){
    const built = [];
    let bi = 0;
    blocks.forEach((b,bIdx)=>{
      if(!b) return;
      const availW = (narrowSet && narrowSet.has(bIdx)) ? resW : cw;
      if(b.kind==='chips'){
        const fs = minD*0.0255;
        const ms = b.items.filter(it=>it.text).map(it=>({...it, m:chipMetrics(ctx,it.text,fs,W)}));
        if(!ms.length) return;
        const h = ms[0].m.h;
        const boxW = ms.reduce((a,it)=>a+it.m.w,0)+fs*0.7*(ms.length-1);
        built.push({bIdx, h, gap:minD*0.042, bi:bi++, boxW, draw:(x,y,p)=>{
          let cx = x;
          ms.forEach(it=>{ drawChip(ctx,it.text,cx,y,it.m,c,it.style); cx += it.m.w + fs*0.7; });
        }});
      }
      else if(b.kind==='fit'){
        if(!String(b.text||'').trim()) return;
        const fb = fitBlock(ctx,b.text,{maxW:availW*(b.wf||1), maxH:b.maxH, max:b.max, min:b.minSize||20, weight:b.weight||900, family:b.family||DISPLAY, lh:b.lh||1.05, italic:b.italic, ls:b.ls!=null?b.ls:-0.012, rich:b.rich, disp:b.disp});
        built.push({bIdx, h:fb.h, gap:b.gap!=null?b.gap:minD*0.036, bi:bi++, boxW:fb.w, draw:(x,y,p)=>{
          if(align==='center') drawLines(ctx,fb,x+fb.w/2, y, b.color||c.ink, 'center', b.rich? c.accent:null, p);
          else drawLines(ctx,fb,x,y,b.color||c.ink,'left', b.rich? c.accent:null, p);
        }});
      }
      else if(b.kind==='stat'){
        const parsed = parseStat(b.text);
        const fb = fitBlock(ctx, parsed.full, {maxW:availW, maxH:H*0.34, max:minD*0.34, min:40, weight:900, lh:1, ls:-0.02, disp:true});
        built.push({bIdx, h:fb.h, gap:minD*0.03, bi:bi++, boxW:fb.w, draw:(x,y,p)=>{
          const txt = parsed.n==null ? parsed.full : parsed.pre + fmtNum(parsed.n*eoExpo(p), parsed.dec, parsed.comma) + parsed.suf;
          ctx.font = fontStr(fb.o, fb.size); setLS(ctx,-0.02*fb.size);
          ctx.fillStyle = b.color||c.accent; ctx.textBaseline='alphabetic';
          if(align==='center'){ ctx.textAlign='center'; ctx.fillText(txt, x+fb.w/2, y+fb.size*0.82); ctx.textAlign='left'; }
          else ctx.fillText(txt, x, y + fb.size*0.82);
          setLS(ctx,0);
        }});
      }
      else if(b.kind==='headshot'){
        const s = minD*(isStory?0.23:0.26);
        built.push({bIdx, h:s+minD*0.02, gap:minD*0.045, bi:bi++, boxW:s, draw:(x,y,p)=>{
          const r = s/2, cxx = x+r, cyy = y+minD*0.01+r;
          ctx.save();
          ctx.strokeStyle = c.accent; ctx.lineWidth = Math.max(4,minD*0.009); ctx.lineCap='round';
          ctx.beginPath(); ctx.arc(cxx,cyy,r+minD*0.016,-Math.PI/2,-Math.PI/2+Math.PI*2*eoCubic(p)); ctx.stroke();
          ctx.beginPath(); ctx.arc(cxx,cyy,r,0,7); ctx.clip();
          const img = state.assets.headshot;
          if(img){
            const sc = Math.max(s/img.width, s/img.height);
            ctx.drawImage(img, cxx-img.width*sc/2, cyy-img.height*sc/2, img.width*sc, img.height*sc);
          } else {
            ctx.fillStyle = c.soft; ctx.fillRect(cxx-r,cyy-r,s,s);
            const nm = (state.fields.spotlight.name||'A').replace(/\*/g,'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
            ctx.fillStyle = c.accent; ctx.font=`900 ${s*0.32}px ${DISPLAY}`;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(nm, cxx, cyy+s*0.02);
            ctx.textBaseline='alphabetic'; ctx.textAlign='left';
          }
          ctx.restore();
        }});
      }
      else if(b.kind==='wave'){
        const h = H*0.072, w = Math.min(cw*0.72, availW);
        built.push({bIdx, h, gap:minD*0.042, bi:bi++, boxW:w, draw:(x,y,p)=>{
          const n=26, bw=w/n*0.58;
          const k = Math.max(2, Math.round(state.dur/2));
          for(let i=0;i<n;i++){
            const amp = 0.3 + RAND[i%64]*0.7;
            const v = Math.abs(Math.sin(2*Math.PI*k*tn + i*0.55));
            const bh = Math.max(h*0.1, h*amp*v);
            ctx.fillStyle = c.accent;
            rr(ctx, x+i*(w/n), y+(h-bh)/2, bw, bh, bw/2); ctx.fill();
          }
        }});
      }
      else if(b.kind==='cta'){
        if(!String(b.text||'').trim()) return;
        const fs = minD*0.031;
        const mm = chipMetrics(ctx,b.text,fs,W);
        built.push({bIdx, h:mm.h, gap:0, bi:bi++, boxW:mm.w, draw:(x,y,p)=>{
          lastCtaBox = {x, y, w:mm.w, h:mm.h};
          drawChip(ctx,b.text,x,y,mm,c,'solid');
        }});
      }
    });
    return built;
  }

  function layout(built){
    const total = built.reduce((a,b,i)=> a + b.h + (i<built.length-1 ? b.gap : 0), 0);
    const topLimit = m*0.9, bottomLimit = H - m*1.65;
    let y = topLimit + Math.max(0,(bottomLimit-topLimit-total)/2);
    built.forEach(b=>{ b.y = y; y += b.h + b.gap; });
  }

  let built = buildAll(null);
  layout(built);
  if(qg){
    const narrow = new Set();
    built.forEach(b=>{
      const overlapsV = (b.y + b.h) > qg.top - minD*0.02 && b.y < qg.bottom;
      const rightEdge = align==='left' ? m + b.boxW : W/2 + b.boxW/2;
      if(overlapsV && rightEdge > qg.x - m*0.3) narrow.add(b.bIdx);
    });
    if(narrow.size){ built = buildAll(narrow); layout(built); }
  }
  built.forEach(b=>{
    const p = beatP(tn, b.bi);
    const xb = align==='center' ? (W - b.boxW)/2 : m;
    reveal(ctx, p, {x:xb, y:b.y, w:b.boxW||cw, h:b.h}, ()=>b.draw(xb,b.y,p), c);
  });
}

/* ---------- stat parsing ---------- */
function parseStat(s){
  s = String(s||'');
  const mt = s.match(/^([^0-9]*)([0-9][0-9.,]*)([\s\S]*)$/);
  if(!mt) return {full:s, n:null};
  const numStr = mt[2];
  const dec = (numStr.split('.')[1]||'').length;
  return {full:s, pre:mt[1], suf:mt[3], n:parseFloat(numStr.replace(/,/g,'')), dec, comma:numStr.includes(',')};
}
function fmtNum(v,dec,comma){
  let s = v.toFixed(dec);
  if(comma){ const parts=s.split('.'); parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); s=parts.join('.'); }
  return s;
}

/* ---------- template draws ---------- */
function drawTemplate(ctx,W,H,tn,c){
  const f = state.fields[state.type];
  const minD = Math.min(W,H);
  const isStory = state.format==='story';
  if(state.type==='recruiting' || state.type==='leverage' || state.type==='coaching' || state.type==='win'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:f.kicker, style:'solid'}]},
      {kind:'fit', text:f.headline, max:minD*(isStory?0.155:0.145), maxH:H*(isStory?0.30:0.36), lh:1.02, rich:true, disp:true},
      {kind:'fit', text:f.sub, max:minD*0.042, maxH:H*0.15, weight:500, color:c.sub, lh:1.3, ls:0},
      {kind:'cta', text:f.cta},
    ]);
    if(state.type==='recruiting' || state.type==='win') drawConfetti(ctx,W,H,tn,c,3);
  }
  else if(state.type==='story'){ drawStory(ctx,W,H,tn,c,f); }
  else if(state.type==='kwevent'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:f.kicker, style:'solid'}]},
      {kind:'fit', text:f.headline, max:minD*(isStory?0.17:0.16), maxH:H*0.26, lh:1.0, rich:true, disp:true},
      {kind:'fit', text:f.tagline, max:minD*0.048, maxH:H*0.09, weight:800, color:c.accent, lh:1.15, ls:0},
      {kind:'chips', items:[{text:f.dateline, style:'outline'}]},
      {kind:'fit', text:f.sub, max:minD*0.036, maxH:H*0.11, weight:500, color:c.sub, lh:1.3, ls:0},
      {kind:'cta', text:f.cta},
    ]);
  }
  else if(state.type==='spotlight'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:f.kicker, style:'solid'}]},
      {kind:'headshot'},
      {kind:'fit', text:f.name, max:minD*(isStory?0.115:0.105), maxH:H*0.17, lh:1.03, rich:true, disp:true},
      {kind:'fit', text:f.detail, max:minD*0.037, maxH:H*0.1, weight:600, color:c.sub, lh:1.3, ls:0},
      {kind:'cta', text:f.cta},
    ]);
    drawConfetti(ctx,W,H,tn,c,4);
  }
  else if(state.type==='event'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:f.kicker, style:'solid'}]},
      {kind:'fit', text:f.headline, max:minD*(isStory?0.16:0.15), maxH:H*0.30, lh:1.02, rich:true, disp:true},
      {kind:'chips', items:[{text:f.dateline, style:'outline'}]},
      {kind:'fit', text:f.sub, max:minD*0.038, maxH:H*0.12, weight:500, color:c.sub, lh:1.3, ls:0},
      {kind:'cta', text:f.cta},
    ]);
  }
  else if(state.type==='podcast'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:'BIG REAL ESTATE ENERGY', style:'solid'},{text:f.epnum, style:'outline'}]},
      {kind:'fit', text:f.headline, max:minD*(isStory?0.14:0.125), maxH:H*0.30, lh:1.05, rich:true, disp:true},
      {kind:'fit', text:f.sub, max:minD*0.037, maxH:H*0.1, weight:500, color:c.sub, lh:1.3, ls:0},
      {kind:'wave'},
      {kind:'cta', text:f.cta},
    ]);
  }
  else if(state.type==='stat'){
    leftStack(ctx,W,H,tn,c,[
      {kind:'chips', items:[{text:f.kicker, style:'solid'}]},
      {kind:'stat', text:f.stat},
      {kind:'fit', text:f.label, max:minD*0.062, maxH:H*0.17, lh:1.12, rich:true, disp:true},
      {kind:'fit', text:f.source, max:minD*0.026, maxH:H*0.06, weight:500, color:c.sub, ls:0, lh:1.3},
      {kind:'cta', text:f.cta},
    ]);
  }
  else if(state.type==='quote'){ drawQuote(ctx,W,H,tn,c,f); }
  else if(state.type==='values'){ drawValues(ctx,W,H,tn,c,f); }
}

function drawQuote(ctx,W,H,tn,c,f){
  const minD = Math.min(W,H), m = Math.round(0.07*minD), cw = W-2*m;
  const markS = minD*0.24;
  const qfb = fitBlock(ctx, '“'+f.quote+'”', {maxW:cw*0.9, maxH:H*0.36, max:minD*0.088, min:26, weight:700, family:SERIF, italic:true, lh:1.22, ls:0});
  const afs = minD*0.030, rfs = minD*0.023;
  const gap1 = minD*0.05, gap2 = minD*0.045, ruleH = Math.max(3,minD*0.006);
  const total = markS*0.52 + gap1*0.7 + qfb.h + gap2 + ruleH + gap2*0.8 + afs*1.3 + (f.role? rfs*1.5 : 0);
  const topLimit = m*0.8, bottomLimit = H - m*1.6;
  let y = topLimit + Math.max(0,(bottomLimit-topLimit-total)/2);
  const cx = W/2;
  // mark
  let p = beatP(tn,0);
  reveal(ctx,p,{x:cx-markS/2,y:y,w:markS,h:markS*0.6},()=>{
    ctx.save(); ctx.translate(cx, y+markS*0.45); ctx.rotate(Math.sin(2*Math.PI*tn)*0.02);
    ctx.font = `900 ${markS}px ${SERIF}`; ctx.fillStyle = c.accent; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('“', 0, markS*0.32); ctx.restore(); ctx.textAlign='left';
  },c);
  y += markS*0.52 + gap1*0.7;
  p = beatP(tn,1);
  reveal(ctx,p,{x:cx-qfb.w/2,y:y,w:qfb.w,h:qfb.h},()=>{ drawLines(ctx,qfb,cx,y,c.ink,'center'); },c);
  y += qfb.h + gap2;
  p = beatP(tn,2);
  reveal(ctx,p,{x:cx-minD*0.045,y:y,w:minD*0.09,h:ruleH},()=>{
    ctx.fillStyle=c.accent; ctx.fillRect(cx-minD*0.045,y,minD*0.09,ruleH);
  },c);
  y += ruleH + gap2*0.8;
  p = beatP(tn,3);
  const attrTxt = String(f.attr||'').toUpperCase();
  reveal(ctx,p,{x:cx-cw/2,y:y,w:cw,h:afs*1.3},()=>{
    ctx.font=`800 ${afs}px ${DISPLAY}`; setLS(ctx,afs*0.14);
    ctx.fillStyle=c.ink; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(attrTxt, cx, y+afs); setLS(ctx,0); ctx.textAlign='left';
  },c);
  y += afs*1.5;
  if(f.role){
    p = beatP(tn,4);
    reveal(ctx,p,{x:cx-cw/2,y:y,w:cw,h:rfs*1.4},()=>{
      ctx.font=`500 ${rfs}px ${DISPLAY}`; ctx.fillStyle=c.sub; ctx.textAlign='center';
      ctx.fillText(f.role, cx, y+rfs); ctx.textAlign='left';
    },c);
  }
}

function drawValues(ctx,W,H,tn,c,f){
  const minD = Math.min(W,H), m = Math.round(0.07*minD), cw = W-2*m;
  const items = String(f.list||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split('|'); return {word:(parts[0]||'').trim(), tag:(parts[1]||'').trim()};
  });
  if(!items.length) return;
  const N = items.length;
  // kicker
  const fs = minD*0.0255, km = chipMetrics(ctx, f.kicker, fs, W);
  const p0 = beatP(tn,0);
  reveal(ctx,p0,{x:(W-km.w)/2, y:m*1.05, w:km.w, h:km.h},()=>{ drawChip(ctx,f.kicker,(W-km.w)/2,m*1.05,km,c,'solid'); },c);
  // cycle
  const seg = (tn*0.9999)*N, idx = Math.floor(seg)%N, local = seg-Math.floor(seg);
  const nxt = (idx+1)%N;
  const TR = 0.2; // transition tail
  const k = local>1-TR ? (local-(1-TR))/TR : 0;
  const cy = H*0.47;
  function wordPair(it, alpha, dy){
    if(alpha<=0.01) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0,dy);
    const wf = fitBlock(ctx, it.word, {maxW:cw, maxH:H*0.22, max:minD*0.19, min:30, weight:900, lh:1, ls:-0.015});
    drawLines(ctx,wf,W/2,cy-wf.h/2,c.ink,'center');
    if(it.tag){
      ctx.font=`600 ${minD*0.037}px ${DISPLAY}`; ctx.fillStyle=c.accent; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText(it.tag, W/2, cy+wf.h/2+minD*0.065); ctx.textAlign='left';
    }
    ctx.restore();
  }
  const ein = eio(k);
  wordPair(items[idx], 1-ein, -ein*H*0.06);
  if(k>0) wordPair(items[nxt], ein, (1-ein)*H*0.07);
  // dots
  const dr = Math.max(3,minD*0.006), dgap = dr*3.4;
  const dw = (N-1)*dgap, dx0 = W/2-dw/2, dy = H*0.47 + H*0.17;
  for(let i=0;i<N;i++){
    ctx.beginPath(); ctx.arc(dx0+i*dgap, dy, dr, 0, 7);
    if(i===idx){ ctx.fillStyle=c.accent; ctx.fill(); }
    else { ctx.fillStyle='rgba(128,128,140,0.35)'; ctx.fill(); }
  }
  // counter
  ctx.font=`700 ${minD*0.024}px ${DISPLAY}`; ctx.fillStyle=c.sub; ctx.textAlign='center';
  ctx.fillText(String(idx+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'), W/2, dy+minD*0.055);
  ctx.textAlign='left';
}

/* ---------- Story Arc (StoryBrand: problem → guide → plan → call) ---------- */
function drawStory(ctx,W,H,tn,c,f){
  const minD=Math.min(W,H), m=Math.round(0.07*minD), cw=W-2*m, cx=W/2;
  const steps = String(f.plan||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
  const P = [[0,0.30],[0.30,0.52],[0.52,0.84],[0.84,1.0001]];
  const loopMode = state.anim==='pulse';
  function phaseAt(i){
    const t0=P[i][0], t1=P[i][1];
    if(tn<t0 || tn>=t1) return null;
    const local=(tn-t0)/(t1-t0);
    const ain=eoCubic(clamp01(local/0.2));
    const aout=(i===3 && !loopMode) ? 0 : eio(clamp01((local-0.86)/0.14));
    return {local, alpha:ain*(1-aout), dy:(1-ain)*H*0.03 - aout*H*0.04};
  }
  let ph = phaseAt(0);
  if(ph){
    ctx.save(); ctx.globalAlpha=ph.alpha; ctx.translate(0,ph.dy);
    const fs=minD*0.0255, km=chipMetrics(ctx,'SOUND FAMILIAR?',fs,W);
    const fb=fitBlock(ctx,f.problem,{maxW:cw*0.92,maxH:H*0.34,max:minD*0.12,min:26,weight:900,lh:1.08,ls:-0.012,rich:true,disp:true});
    let y=(H-(km.h+minD*0.05+fb.h))/2 - H*0.03;
    drawChip(ctx,'SOUND FAMILIAR?',(W-km.w)/2,y,km,c,'solid'); y+=km.h+minD*0.05;
    drawLines(ctx,fb,cx,y,c.ink,'center',c.accent);
    ctx.restore();
  }
  ph = phaseAt(1);
  if(ph){
    ctx.save(); ctx.globalAlpha=ph.alpha; ctx.translate(0,ph.dy);
    const fs=minD*0.0255, km=chipMetrics(ctx,'ENTER THE GUIDE',fs,W);
    const fb=fitBlock(ctx,f.guide,{maxW:cw*0.84,maxH:H*0.3,max:minD*0.075,min:24,weight:700,family:SERIF,italic:true,lh:1.25,ls:0});
    const lk=minD*0.026;
    let y=(H-(km.h+minD*0.05+fb.h+minD*0.065+lk))/2 - H*0.02;
    drawChip(ctx,'ENTER THE GUIDE',(W-km.w)/2,y,km,c,'outline'); y+=km.h+minD*0.05;
    drawLines(ctx,fb,cx,y,c.ink,'center'); y+=fb.h+minD*0.065;
    ctx.font=`800 ${lk}px ${DISPLAY}`; setLS(ctx,lk*0.13);
    ctx.fillStyle=c.accent; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('KELLER WILLIAMS INDY METRO PARTNERS', cx, y+lk);
    setLS(ctx,0); ctx.textAlign='left';
    ctx.restore();
  }
  ph = phaseAt(2);
  if(ph && steps.length){
    ctx.save(); ctx.globalAlpha=ph.alpha; ctx.translate(0,ph.dy);
    const fs=minD*0.0255, km=chipMetrics(ctx,'THE PLAN',fs,W);
    const sfs=minD*0.05, rowH=sfs*2.0, gap=minD*0.055;
    const yStart0=(H-(km.h+gap+steps.length*rowH))/2 - H*0.02;
    drawChip(ctx,'THE PLAN',(W-km.w)/2,yStart0,km,c,'solid');
    const yRows=yStart0+km.h+gap;
    steps.forEach((s,i)=>{
      const sp=clamp01((ph.local-0.16-i*0.13)/0.16);
      if(sp<=0) return;
      const yR=yRows+i*rowH;
      ctx.save(); ctx.globalAlpha*=eoCubic(sp); ctx.translate((1-eoBack(sp))*-minD*0.018,0);
      const num=String(i+1).padStart(2,'0');
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.font=`900 ${sfs}px ${DISPLAY}`;
      const numW=ctx.measureText(num).width;
      ctx.font=`700 ${sfs*0.64}px ${DISPLAY}`;
      let txt=s;
      while(ctx.measureText(txt).width>cw*0.72 && txt.length>4) txt=txt.slice(0,-2);
      if(txt!==s) txt+='…';
      const rowW=numW+sfs*0.45+ctx.measureText(txt).width;
      const x=(W-rowW)/2;
      ctx.font=`900 ${sfs}px ${DISPLAY}`; ctx.fillStyle=c.accent;
      ctx.fillText(num, x, yR+rowH*0.6);
      ctx.font=`700 ${sfs*0.64}px ${DISPLAY}`; ctx.fillStyle=c.ink;
      ctx.fillText(txt, x+numW+sfs*0.45, yR+rowH*0.6);
      ctx.restore();
    });
    ctx.restore();
  }
  ph = phaseAt(3);
  if(ph){
    ctx.save(); ctx.globalAlpha=ph.alpha; ctx.translate(0,ph.dy);
    const fb=fitBlock(ctx,'Your move.',{maxW:cw*0.9,maxH:H*0.2,max:minD*0.115,min:30,weight:900,lh:1.0,ls:-0.012,disp:true});
    const fs2=minD*0.034, km=chipMetrics(ctx,f.cta,fs2,W);
    let y=(H-(fb.h+minD*0.065+km.h))/2;
    drawLines(ctx,fb,cx,y,c.ink,'center'); y+=fb.h+minD*0.065;
    lastCtaBox={x:(W-km.w)/2, y, w:km.w, h:km.h};
    drawChip(ctx,f.cta,(W-km.w)/2,y,km,c,'solid');
    ctx.restore();
  }
  const cur=P.findIndex(pp=>tn>=pp[0]&&tn<pp[1]);
  const dr=Math.max(3,minD*0.005), dgap=dr*3.4, dw=3*dgap;
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.arc(cx-dw/2+i*dgap, H-m*1.9, dr, 0, 7);
    ctx.fillStyle = i===cur ? c.accent : 'rgba(128,128,140,0.35)'; ctx.fill();
  }
}

function drawConfetti(ctx,W,H,tn,c,beatIdx){
  if(state.anim==='pulse' || !lastCtaBox) return;
  const {d,stag,start} = beatTimes();
  const t0 = start + (beatIdx||3)*stag + d*0.6;
  const L = Math.min(0.22, 0.9/state.dur);
  const q = (tn-t0)/L;
  if(q<=0 || q>=1) return;
  const e = eoCubic(q);
  const ox = lastCtaBox.x + lastCtaBox.w*0.5, oy = lastCtaBox.y + lastCtaBox.h*0.5;
  const sc = H/1080;
  CONFETTI.forEach(pt=>{
    const x = ox + Math.cos(pt.a)*pt.sp*e*260*sc;
    const y = oy + Math.sin(pt.a)*pt.sp*e*190*sc + 320*q*q*sc;
    const s = pt.sz*13*sc;
    ctx.save(); ctx.globalAlpha = (1-q)*0.9; ctx.translate(x,y); ctx.rotate(pt.rot + q*4);
    ctx.fillStyle = pt.k===0 ? c.accent : pt.k===1 ? (c.theme==='redfield'?'rgba(255,255,255,.9)':c.ink) : 'rgba(128,128,140,.6)';
    ctx.fillRect(-s/2,-s/2,s,s*0.62); ctx.restore();
  });
}

/* ---------- QR rendering ---------- */
let qrCache = {key:'', cv:null, err:false};
function getQRCanvas(){
  const key = state.qr.url+'|'+state.qr.style+'|'+state.brandRed;
  if(qrCache.key===key) return qrCache.err ? null : qrCache.cv;
  qrCache = {key, cv:null, err:false};
  try{
    const q = qrcode(0,'Q'); q.addData(state.qr.url); q.make();
    const n = q.getModuleCount();
    const S = 720, quiet = 4, cells = n+quiet*2, cell = S/cells;
    const cv = document.createElement('canvas'); cv.width = cv.height = S;
    const c2 = cv.getContext('2d');
    c2.fillStyle='#FFFFFF'; c2.fillRect(0,0,S,S);
    const dark = '#141419', red = state.brandRed, style = state.qr.style;
    const inFinder = (r,cc)=> (r<7&&cc<7)||(r<7&&cc>=n-7)||(r>=n-7&&cc<7);
    // data modules
    for(let r=0;r<n;r++) for(let cc=0;cc<n;cc++){
      if(!q.isDark(r,cc) || (style!=='classic' && inFinder(r,cc))) continue;
      const x=(cc+quiet)*cell, y=(r+quiet)*cell;
      c2.fillStyle = style==='red' ? red : dark;
      if(style==='classic'){ c2.fillRect(x-0.25,y-0.25,cell+0.5,cell+0.5); }
      else { rr(c2, x+cell*0.03, y+cell*0.03, cell*0.94, cell*0.94, cell*0.28); c2.fill(); }
    }
    // finder patterns as solid shapes (scanner-critical): 7×7 ring + 3×3 core
    if(style!=='classic'){
      const fCol = style==='red' ? red : red; // brand-red finders in both styled modes
      const core = style==='red' ? red : dark;
      [[0,0],[n-7,0],[0,n-7]].forEach(([fr,fc])=>{
        const x=(fc+quiet)*cell, y=(fr+quiet)*cell, s7=cell*7;
        c2.fillStyle = fCol;
        rr(c2, x, y, s7, s7, cell*1.6); c2.fill();
        c2.fillStyle = '#FFFFFF';
        rr(c2, x+cell, y+cell, cell*5, cell*5, cell*1.1); c2.fill();
        c2.fillStyle = core;
        rr(c2, x+cell*2, y+cell*2, cell*3, cell*3, cell*0.85); c2.fill();
      });
    }
    qrCache.cv = cv;
  }catch(e){ qrCache.err = true; }
  return qrCache.cv;
}
function drawQR(ctx,W,H,tn,c){
  const qg = qrGeom(W,H); if(!qg) return;
  const img = getQRCanvas(); if(!img) return;
  const {d,stag,start} = beatTimes();
  const p = state.anim==='pulse' ? 1 : clamp01((tn-(start+4*stag))/d);
  if(p<=0) return;
  ctx.save();
  const e = eoBack(p);
  ctx.globalAlpha = Math.min(1, p*1.8);
  const cx = qg.x+qg.cardW/2, cy = qg.y+qg.cardH/2;
  ctx.translate(cx,cy); const sc = 0.85+0.15*e; ctx.scale(sc,sc); ctx.translate(-cx,-cy);
  ctx.shadowColor = 'rgba(0,0,0,0.30)'; ctx.shadowBlur = qg.sz*0.14; ctx.shadowOffsetY = qg.sz*0.035;
  ctx.fillStyle = '#FFFFFF'; rr(ctx,qg.x,qg.y,qg.cardW,qg.cardH,qg.sz*0.1); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.drawImage(img, qg.x+qg.pad, qg.y+qg.pad, qg.sz, qg.sz);
  const lf = Math.max(11, qg.sz*0.105);
  let lbl = state.qr.url.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');
  let txt = 'SCAN · '+lbl;
  ctx.font = `700 ${lf}px ${DISPLAY}`;
  if(lbl.length>24 || ctx.measureText(txt).width > qg.cardW*1.7) txt = 'SCAN TO REGISTER';
  ctx.fillStyle = c.photo ? '#FFFFFF' : (c.theme==='redfield' ? '#FFFFFF' : c.sub);
  ctx.textAlign='center';
  ctx.fillText(txt, cx, qg.y+qg.cardH+lf*1.35);
  ctx.textAlign='left';
  ctx.restore();
}

/* ---------- logo sting intro ---------- */
function drawSting(ctx,W,H,p,c){
  const minD = Math.min(W,H);
  ctx.fillStyle = state.brandRed; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.arc(W*0.9, H*0.1, H*0.4*(0.8+0.2*p), 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.06, H*0.94, H*0.3*(0.8+0.2*p), 0, 7); ctx.fill();
  const inP = eoExpo(clamp01(p/0.55));
  const outK = p>0.8 ? eio((p-0.8)/0.2) : 0;
  ctx.save();
  ctx.globalAlpha = (1-outK);
  ctx.translate(0, -outK*H*0.1);
  const fs = minD*0.062;
  const cy = H/2;
  const s = fs*0.72*inP;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(W/2 - s/2, cy - fs*1.62 - s/2, s, s);
  ctx.font = `900 ${fs}px ${DISPLAY}`; setLS(ctx, fs*0.06);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.save(); ctx.translate(W/2, cy+fs*0.2); ctx.scale(0.9+0.1*inP, 0.9+0.1*inP); ctx.globalAlpha *= inP;
  ctx.fillText('KELLER WILLIAMS', 0, 0); ctx.restore();
  const f2 = fs*0.42;
  ctx.font = `500 ${f2}px ${DISPLAY}`; setLS(ctx, f2*0.34);
  ctx.globalAlpha *= clamp01((p-0.25)/0.3);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText('INDY METRO PARTNERS', W/2, cy+fs*0.2+f2*1.9);
  setLS(ctx,0); ctx.textAlign='left';
  ctx.restore();
}
function drawPbar(ctx,W,H,rawTn,c){
  if(!state.pbar) return;
  const h = Math.max(4, H*0.0065);
  ctx.fillStyle = c.theme==='redfield' ? 'rgba(255,255,255,0.25)' : 'rgba(128,128,140,0.22)';
  ctx.fillRect(0,H-h,W,h);
  ctx.fillStyle = c.theme==='redfield' ? '#FFFFFF' : c.accent;
  ctx.fillRect(0,H-h,W*clamp01(rawTn),h);
}

/* ---------- master frame ---------- */
function drawFrame(ctx,W,H,tn){
  const c = getColors();
  const rawTn = tn;
  lastCtaBox = null;
  ctx.save();
  ctx.clearRect(0,0,W,H);
  const stingOn = state.sting && state.anim!=='pulse';
  const sT = Math.min(0.12, 1.1/state.dur);
  if(stingOn && tn < sT){
    drawSting(ctx,W,H,tn/sT,c);
    if(state.toggles.grain){ ctx.globalAlpha=0.05; ctx.fillStyle=makeGrain(ctx); ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    drawPbar(ctx,W,H,rawTn,c);
    ctx.restore();
    return;
  }
  if(stingOn) tn = (tn-sT)/(1-sT);
  ctx.fillStyle = c.bg; ctx.fillRect(0,0,W,H);
  drawPhoto(ctx,W,H,tn,c);
  drawMotif(ctx,W,H,tn,c);
  drawTemplate(ctx,W,H,tn,c);
  drawQR(ctx,W,H,tn,c);
  drawBrand(ctx,W,H,tn,c);
  if(state.anim==='wipe'){
    const pw = clamp01(tn/0.2);
    if(pw<1){
      const e = eio(pw);
      const x = -W*0.3 + e*(W*1.6);
      ctx.save(); ctx.translate(x, H/2); ctx.rotate(-0.06);
      ctx.fillStyle = c.theme==='redfield' ? '#FFFFFF' : c.red;
      ctx.globalAlpha = 0.97;
      ctx.fillRect(-W*0.09, -H*0.75, W*0.18, H*1.5);
      ctx.restore();
    }
  }
  if(state.toggles.grain){
    ctx.globalAlpha = 0.05; ctx.fillStyle = makeGrain(ctx); ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
  }
  drawPbar(ctx,W,H,rawTn,c);
  ctx.restore();
}

/* ---------- team slide template (lobby-only) ---------- */
function drawTeam(ctx,W,H,tn,c){
  const t = state.team; if(!t) return;
  const minD=Math.min(W,H), m=Math.round(0.07*minD);
  const n=t.members.length;
  const fs=minD*0.030, km=chipMetrics(ctx,t.title,fs,W);
  const p0=beatP(tn,0);
  reveal(ctx,p0,{x:(W-km.w)/2,y:m*0.9,w:km.w,h:km.h},()=>drawChip(ctx,t.title,(W-km.w)/2,m*0.9,km,c,'solid'),c);
  const top=m*0.9+km.h+minD*0.04, bottom=H-m*1.7;
  const maxCols = W>=H ? 5 : 3;
  const rows0 = Math.ceil(n/maxCols);
  const cols = Math.min(n, Math.ceil(n/rows0));   // balanced rows (e.g. 11 → 4/4/3, not 5/5/1)
  const rows = Math.ceil(n/cols);
  const cw=(W-2*m)/cols, ch=(bottom-top)/rows;
  const d=Math.min(cw*0.6, ch*0.5);
  const nameF=Math.max(13,minD*0.024), roleF=Math.max(11,minD*0.0165);
  t.members.forEach((mm,i)=>{
    const r=Math.floor(i/cols), colInRow=i-r*cols;
    const inRow=(r===rows-1)?(n-r*cols):cols;
    const rowOffset=(cols-inRow)*cw/2;
    const cx=m+rowOffset+(colInRow+0.5)*cw;
    const cy=top+r*ch+ch*0.42;
    const p=beatP(tn,1+i);
    if(p<=0) return;
    ctx.save();
    ctx.globalAlpha=Math.min(1,p*1.6);
    const e=eoBack(p);
    ctx.translate(cx,cy); const sc=0.9+0.1*e; ctx.scale(sc,sc); ctx.translate(-cx,-cy);
    ctx.strokeStyle=c.accent; ctx.lineWidth=Math.max(3,minD*0.0045); ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,cy,d/2+minD*0.007,-Math.PI/2,-Math.PI/2+Math.PI*2*eoCubic(p)); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,d/2,0,7); ctx.clip();
    const img=mm.img;
    if(img){ const s2=Math.max(d/img.width,d/img.height); ctx.drawImage(img,cx-img.width*s2/2,cy-img.height*s2/2,img.width*s2,img.height*s2); }
    else{ ctx.fillStyle=c.soft; ctx.fillRect(cx-d/2,cy-d/2,d,d); }
    ctx.restore();
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font=`800 ${nameF}px ${DISPLAY}`; ctx.fillStyle=c.ink;
    ctx.fillText(mm.name, cx, cy+d/2+nameF*1.6);
    if(mm.role){
      ctx.font=`500 ${roleF}px ${DISPLAY}`; ctx.fillStyle=c.sub;
      const lines=wrapText(ctx,mm.role,cw*0.95);
      lines.slice(0,2).forEach((l,li)=>ctx.fillText(l,cx,cy+d/2+nameF*1.6+roleF*1.5*(li+1)));
    }
    ctx.textAlign='left';
    ctx.restore();
  });
}
/* hook the team template into the engine's dispatcher */
const __baseDrawTemplate = drawTemplate;
drawTemplate = function(ctx,W,H,tn,c){
  if(state.type==='team') return drawTeam(ctx,W,H,tn,c);
  return __baseDrawTemplate(ctx,W,H,tn,c);
};

/* ---------- config via URL params ---------- */
const PARAMS = new URLSearchParams(location.search);
let ORDER = PLAYLIST.map((_,i)=>i);
if(PARAMS.get('only')){
  const cats = PARAMS.get('only').split(',').map(s=>s.trim());
  ORDER = ORDER.filter(i=>cats.includes(PLAYLIST[i].cat));
  if(!ORDER.length) ORDER = PLAYLIST.map((_,i)=>i);
}
if(PARAMS.get('shuffle')==='1'){
  for(let i=ORDER.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ORDER[i],ORDER[j]]=[ORDER[j],ORDER[i]]; }
}
const NOQR = PARAMS.get('noqr')==='1';
const DARK_THEMES = ['obsidian','blackout','redfield'];

/* ---------- canvases & scheduler ---------- */
const live = document.getElementById('live');
const lctx = live.getContext('2d');
const snap = document.getElementById('snap');
const sctx = snap.getContext('2d');
const hud = document.getElementById('hud');
const hudTitle = document.getElementById('hudTitle');
const hudIdx = document.getElementById('hudIdx');

let cur = Math.min(parseInt(PARAMS.get('start')||'0',10)||0, ORDER.length-1);
let tn = 0, lastTs = null, paused = false, rafId = null;

function sizeCanvases(){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  const w = Math.max(2, Math.round(innerWidth*dpr)), h = Math.max(2, Math.round(innerHeight*dpr));
  if(live.width!==w || live.height!==h){ live.width=snap.width=w; live.height=snap.height=h; }
  state.format = w>=h ? 'wide' : 'portrait';
}
addEventListener('resize', ()=>{ sizeCanvases(); });

function applySlide(s){
  const cfg = s.cfg;
  state.type = cfg.type;
  state.theme = cfg.theme;
  state.anim = cfg.anim || 'slide';
  state.align = cfg.align || 'left';
  state.font = cfg.font || 'system';
  state.sting = !!cfg.sting;
  state.dur = s.dur;
  state.pbar = false; state.safe = false;
  state.toggles.lockup = true; state.toggles.disc = true; state.toggles.motif = true; state.toggles.grain = true;
  if(cfg.fields && state.fields[cfg.type]) Object.assign(state.fields[cfg.type], cfg.fields);
  state.qr = (!NOQR && cfg.qr) ? {...cfg.qr} : {on:false,url:'https://heykw.com',size:'l',style:'dots',dirty:true};
  state.assets.headshot = s.headshot ? (IMGS.faces[s.headshot]||null) : null;
  state.assets.photo = null;
  state.assets.logo = DARK_THEMES.includes(cfg.theme) ? IMGS.logoRev : IMGS.logoLight;
  state.team = s.team ? {title:s.team.title, members:s.team.members.map(mm=>({...mm, img:IMGS.faces[mm.k]||null}))} : null;
}

function crossfadeFromCurrent(){
  try{
    sctx.clearRect(0,0,snap.width,snap.height);
    sctx.drawImage(live,0,0);
    snap.style.transition = 'none'; snap.style.opacity = '1';
    void snap.offsetWidth;
    snap.style.transition = 'opacity 0.75s ease'; snap.style.opacity = '0';
  }catch(e){}
}

function goTo(i, fade){
  if(fade!==false) crossfadeFromCurrent();
  cur = ((i % ORDER.length) + ORDER.length) % ORDER.length;
  tn = 0; lastTs = null;
  applySlide(PLAYLIST[ORDER[cur]]);
  hudTitle.textContent = PLAYLIST[ORDER[cur]].id.replace(/-/g,' ');
  hudIdx.textContent = (cur+1)+' / '+ORDER.length;
}

function tick(ts){
  rafId = requestAnimationFrame(tick);
  const dt = lastTs==null ? 0 : Math.min(100, ts-lastTs);
  lastTs = ts;
  if(!paused){
    tn += dt/(PLAYLIST[ORDER[cur]].dur*1000);
    if(tn>=1){ goTo(cur+1); }
  }
  drawFrame(lctx, live.width, live.height, Math.min(tn,0.9999));
}

/* ---------- kiosk controls ---------- */
let hudTimer=null, cursorTimer=null;
function poke(){
  hud.classList.add('show');
  document.body.classList.remove('idle');
  clearTimeout(hudTimer); hudTimer=setTimeout(()=>hud.classList.remove('show'), 3500);
  clearTimeout(cursorTimer); cursorTimer=setTimeout(()=>document.body.classList.add('idle'), 4000);
}
addEventListener('mousemove', poke);
addEventListener('touchstart', poke, {passive:true});
document.getElementById('btnPrev').onclick = ()=>{ goTo(cur-1); poke(); };
document.getElementById('btnNext').onclick = ()=>{ goTo(cur+1); poke(); };
const btnPP = document.getElementById('btnPP');
btnPP.onclick = ()=>{ paused=!paused; btnPP.textContent = paused?'▶':'⏸'; poke(); };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); btnPP.click(); }
  else if(e.code==='ArrowRight'){ goTo(cur+1); poke(); }
  else if(e.code==='ArrowLeft'){ goTo(cur-1); poke(); }
});
/* keep the screen awake where supported (needs https or localhost) */
async function wakeLock(){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) wakeLock(); });
wakeLock();

/* ---------- boot ---------- */
(async function boot(){
  const jobs = [];
  for(const k of Object.keys(LOBBY_ASSETS.faces)) jobs.push(loadImg(LOBBY_ASSETS.faces[k],'image/jpeg').then(im=>{ IMGS.faces[k]=im; }));
  jobs.push(loadImg(LOBBY_ASSETS.logoLight,'image/png').then(im=>{ IMGS.logoLight=im; }));
  jobs.push(loadImg(LOBBY_ASSETS.logoRev,'image/png').then(im=>{ IMGS.logoRev=im; }));
  await Promise.all(jobs);
  sizeCanvases();
  goTo(cur, false);
  poke();
  rafId = requestAnimationFrame(tick);
})();

/* test hooks */
window.__lobby = {
  n: ORDER.length,
  goto(i){ paused=true; goTo(i,false); },
  at(t){ paused=true; tn=t; drawFrame(lctx, live.width, live.height, t); },
  png(){ return live.toDataURL('image/png'); },
  state,
};
